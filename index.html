<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero 1 UI</title>
    <!-- STYLE LINK -->
    <link rel="stylesheet" href="output.css" />
    <style>
      @keyframes toAndFrom {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(-20deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-500 font-body m-0 p-0">
    <!-- NAVBAR -->
    <nav class="fixed z-9999 w-full bg-light shadow-lg py-3 px-7 flex justify-between items-center">
      <div id="logo" class="font-bold text-2xl text-text tracking-wide">NEXORA</div>

      <div class="flex justify-center items-center gap-5">
        <a href="#" class="text-[.8rem] transition-all duration-300 tracking-tight font-bold text-primary hover:text-primary">About Us</a>
        <a href="#" class="text-[.8rem] transition-all duration-300 tracking-tight font-bold text-text hover:text-primary">Services</a>
        <a href="#" class="text-[.8rem] transition-all duration-300 tracking-tight font-bold text-text hover:text-primary">Blog</a>
        <a href="#" class="text-[.8rem] transition-all duration-300 tracking-tight font-bold text-text hover:text-primary">Conatct Us</a>
        <a
          href="#"
          class="bg-primary transition-all duration-300 text-light ml-3 py-[.3rem] px-6 rounded-[3px] text-[.8rem] tracking-wide font-medium hover:bg-transparent hover:text-text border-[1.5px] border-primary"
          >Learn</a
        >
      </div>
    </nav>
    <!-- MAIN -->
    <main class="relative w-full h-full">
      <!-- HERO SECTION -->
      <div id="hero" class="bg-light overflow-hidden flex items-center justify-center min-h-screen">
        <div class="">
          <h1
            class="bg-gradient-to-l from-primary/90 to-text/100 bg-clip-text text-transparent mb-5 text-shadow-[2px_2px_4px_rgba(0,0,0,0.2)] text-[2.8rem] font-extrabold font-heading tracking-[.1rem] leading-[50px]"
          >
            Transforming Ideas <br />
            into Innovative <br />
            Mobile Apps
          </h1>
          <p class="w-120 mb-8 text-[.8rem] leading-[20px] text-text font-bold">
            With our expertise and passion for innovation, we bring your ideas to life <br />
            and deliver exceptional user experiences.
          </p>
          <a
            href="#"
            class="bg-primary transition-all duration-300 text-light py-3 px-8 mr-4 rounded-[3px] text-[13px] tracking-wider font-bold hover:bg-transparent hover:text-text border-[1.5px] border-primary"
            >Learn More</a
          >
          <a
            href="#"
            class="bg-transparent text-text border-[1.5px] border-primary transition-all duration-300 py-3 px-8 rounded-[3px] text-[13px] tracking-wider font-bold hover:bg-primary hover:text-light"
            >Contact Us</a
          >
        </div>

        <div class="w-120 flex self-end">
          <div id="image" class="relative w-full">
            <div class="absolute top-20 right-35 w-50 h-50 rounded-full blur-3xl bg-primary"></div>

            <img class="relative w-full object-contain object-bottom" src="girl image.png" alt="Image" />
            <span
              class="inline-block absolute top-2 right-2 bg-dark text-light font-extrabold px-3 py-1 text-8xl -rotate-8"
              style="animation: toAndFrom 1.5s linear infinite alternate"
              >3</span
            >
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
